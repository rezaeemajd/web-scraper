services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdi}
      POSTGRES_USER: ${POSTGRES_USER:-cdi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - cdi_postgres_data:/var/lib/postgresql/data
    networks: [cdi]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - cdi_redis_data:/data
    networks: [cdi]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 2 --timeout 120
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [cdi]
    mem_limit: 384m

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: celery -A config worker --loglevel=INFO --concurrency=1 --prefetch-multiplier=1 --queues=scraping --max-tasks-per-child=50
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [cdi]
    mem_limit: 256m

  beat:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: celery -A config beat --loglevel=INFO
    depends_on:
      redis: {condition: service_healthy}
    networks: [cdi]
    mem_limit: 128m

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8001/api/v1}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [backend]
    networks: [cdi]
    mem_limit: 256m

volumes:
  cdi_postgres_data:
  cdi_redis_data:

networks:
  cdi:
    name: ${CDI_NETWORK_NAME:-cofinets_data_network}
    driver: bridge
