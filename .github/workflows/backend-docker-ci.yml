name: CDI Backend Docker CI

on:
  push:
    branches: [cdi-v1-p1-core-data-engine]
  pull_request:
    branches: [cdi-v1-foundation]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag cdi-backend-ci:latest ./backend
      - name: Verify image
        run: docker image inspect cdi-backend-ci:latest >/dev/null
